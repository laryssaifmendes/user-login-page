<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERRO 404</title>
    <link rel="icon" type="image/png" href="assets/icon.jpg" />
    <style>
      :root {
        --pink: #ff2ac7;
        --cyan: #1ef2ff;
        --yellow: #ffe600;
        --green: #43ff8d;
        --orange: #ff8a00;
        --red: #ff3646;
        --blue: #1f2dff;
        --black: #050505;
        --white: #fefefe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        background:
          repeating-linear-gradient(
            135deg,
            var(--pink) 0 30px,
            var(--cyan) 30px 60px,
            var(--yellow) 60px 90px,
            var(--pink) 90px 120px
          );
        font-family: Arial, Helvetica, sans-serif;
      }

      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.08);
        pointer-events: none;
      }

      .banner-top,
      .banner-bottom {
        position: absolute;
        left: -10%;
        width: 120%;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.5rem, 2vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.2rem;
        text-transform: uppercase;
        color: #111;
        border-top: 6px solid #000;
        border-bottom: 6px solid #000;
        animation: pulse 0.2s infinite alternate;
      }

      .banner-top {
        top: 6%;
        background: var(--yellow);
        transform: rotate(-7deg);
      }

      .banner-bottom {
        bottom: 6%;
        background: var(--green);
        transform: rotate(9deg);
      }

      .panel {
        position: relative;
        z-index: 2;
        width: min(88vw, 820px);
        min-height: 72vh;
        margin: 12vh auto;
        background: var(--orange);
        border: 8px dashed var(--green);
        box-shadow: 14px 14px 0 var(--blue), 28px 28px 0 var(--red);
        padding: 32px 20px 24px;
        transform: rotate(-3deg) skewX(-2deg);
        text-align: center;
      }

      .status {
        display: inline-block;
        width: 100%;
        margin: 0 0 16px;
        font-size: clamp(2.8rem, 8vw, 9rem);
        line-height: 0.78;
        letter-spacing: -0.12em;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--blue);
        text-shadow: 6px 6px 0 var(--yellow), -6px -6px 0 var(--pink);
        transform: rotate(-7deg) scaleY(1.6);
      }

      .subtext {
        display: block;
        margin: 0 auto 18px;
        width: min(86%, 640px);
        font-size: clamp(1.1rem, 2vw, 2.5rem);
        font-weight: 900;
        letter-spacing: 0.1rem;
        color: rgba(17,17,17,0.72);
        background: #fef7a8;
        border: 4px solid #000;
        transform: rotate(4deg);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 14px;
        width: min(90%, 700px);
        margin: 18px auto 0;
      }

      .floating-controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
      }

      .float-btn, .mini-card {
        pointer-events: auto;
        transition: transform 0.2s ease, left 0.2s ease, top 0.2s ease, box-shadow 0.2s ease;
      }

      .float-btn {
        position: absolute;
        min-width: 130px;
        min-height: 56px;
        padding: 10px 18px;
        border: 5px solid #050505;
        background: linear-gradient(135deg, #ffef5a, #ff7a18, #ff3a6d);
        color: #000;
        font-size: 0.9rem;
        font-weight: 900;
        letter-spacing: 0.14rem;
        text-transform: uppercase;
        box-shadow: 6px 6px 0 #1ef2ff;
        cursor: pointer;
        transform: rotate(var(--tilt, 0deg));
        user-select: none;
      }

      .float-btn:hover,
      .mini-card:hover {
        box-shadow: 10px 10px 0 #ff2ac7;
      }

      .float-btn:nth-child(1) { top: 12%; left: 6%; --tilt: -12deg; }
      .float-btn:nth-child(2) { top: 18%; right: 8%; --tilt: 9deg; }
      .float-btn:nth-child(3) { bottom: 20%; left: 10%; --tilt: -15deg; }
      .float-btn:nth-child(4) { bottom: 14%; right: 6%; --tilt: 17deg; }
      .float-btn:nth-child(5) { top: 48%; left: 50%; --tilt: -6deg; }

      .mini-card {
        min-height: 120px;
        border: 5px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08rem;
        font-size: clamp(1rem, 2vw, 1.8rem);
        padding: 8px;
        animation: blink 0.18s infinite alternate;
        cursor: pointer;
      }

      .mini-card:nth-child(1) {
        background: var(--white);
        color: var(--red);
        transform: rotate(-11deg);
      }

      .mini-card:nth-child(2) {
        background: var(--cyan);
        color: #222;
        transform: rotate(8deg);
      }

      .mini-card:nth-child(3) {
        background: var(--yellow);
        color: var(--blue);
        transform: rotate(-6deg);
      }

      .mini-card:nth-child(4) {
        background: var(--red);
        color: #fff;
        transform: rotate(12deg);
      }

      .cta {
        display: inline-block;
        margin-top: 26px;
        min-width: min(78%, 500px);
        min-height: 110px;
        padding: 16px 28px;
        border: 7px solid #000;
        background: linear-gradient(90deg, #0d42ff 0%, #ffea00 30%, #ff3a4a 60%, #00d3ff 100%);
        color: #000;
        font-size: clamp(1.8rem, 4vw, 4rem);
        font-weight: 900;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        transform: rotate(-4deg) scale(1.06);
        box-shadow: 10px 10px 0 var(--pink), -10px -10px 0 var(--yellow);
        cursor: pointer;
        animation: shake 0.28s infinite alternate;
      }

      @keyframes pulse {
        from { filter: brightness(1); }
        to { filter: brightness(1.5) contrast(1.6); }
      }

      @keyframes blink {
        from { opacity: 1; }
        to { opacity: 0.7; }
      }

      @keyframes shake {
        0% { transform: rotate(-7deg) scale(1.04); }
        100% { transform: rotate(8deg) scale(1.12); }
      }

      @media (max-width: 700px) {
        .card-grid {
          grid-template-columns: 1fr;
        }

        .panel {
          min-height: auto;
          padding-top: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="banner-top">ERRO</div>
    <div class="banner-bottom">sistema funcionando!</div>

    <main class="panel">
      <div class="status">ERRO</div>
      <div class="subtext">LOGIN REALIZADO COM SUCESSO</div>

      <div class="floating-controls" aria-hidden="true">
        <button class="float-btn" type="button">alerta</button>
        <button class="float-btn" type="button">relatório</button>
        <button class="float-btn" type="button">backup</button>
        <button class="float-btn" type="button">suporte</button>
        <button class="float-btn" type="button">sair</button>
      </div>

      <div class="card-grid">
        <div class="mini-card">painel</div>
        <div class="mini-card">status</div>
        <div class="mini-card">dados</div>
        <div class="mini-card">opções</div>
      </div>

      <button class="cta" type="button" onclick="window.location.href='index.html'">voltar ao login</button>
    </main>

    <script>
      const escapedButtons = document.querySelectorAll('.float-btn, .mini-card');
      escapedButtons.forEach((node) => {
        const escapeRandomly = () => {
          const maxX = Math.max(30, window.innerWidth * 0.75);
          const maxY = Math.max(30, window.innerHeight * 0.7);
          const left = Math.random() * (maxX - 140);
          const top = Math.random() * (maxY - 70);
          node.style.left = `${left}px`;
          node.style.top = `${top}px`;
          node.style.transform = `rotate(${(Math.random() * 30 - 15).toFixed(1)}deg) scale(${(Math.random() * 0.7 + 0.9).toFixed(2)})`;
        };

        node.addEventListener('mouseenter', escapeRandomly);
        node.addEventListener('click', escapeRandomly);
      });
    </script>
  </body>
</html>
